# Include in the TLS server block for the endpoint in docs/connect.js.
location = /_aria2/jsonrpc {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($http_authorization = "") { return 401; }

    client_max_body_size 32m;
    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/jsonrpc;
}

# Read-only view of the existing authenticated download library.
location = /_aria2/library {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers Authorization always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != GET) { return 405; }
    if ($http_authorization = "") { return 401; }

    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_set_header Authorization "";
    proxy_hide_header Cache-Control;
    proxy_pass http://127.0.0.1:18081/library/list;
}
