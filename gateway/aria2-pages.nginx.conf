# Include in the TLS server block for the endpoint in docs/connect.js.
location = /_aria2/jsonrpc {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($http_authorization = "") { return 401; }

    client_max_body_size 32m;
    satisfy any;
    auth_request /_aria2_session_check;
    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/jsonrpc;
}

# List the contents of the current download folder.
location = /_aria2/library {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers Authorization always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != GET) { return 405; }
    if ($http_authorization = "") { return 401; }

    satisfy any;
    auth_request /_aria2_session_check;
    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_set_header Authorization "";
    proxy_hide_header Cache-Control;
    proxy_pass http://127.0.0.1:18081/library/list;
}

location ~ ^/_aria2/library/(item|trash(/all)?|restore)$ {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    set $library_operation "$request_method:$uri";
    if ($library_operation !~ "^(GET:/_aria2/library/trash|DELETE:/_aria2/library/(item|trash/all)|POST:/_aria2/library/restore)$") { return 405; }
    if ($http_authorization = "") { return 401; }

    client_max_body_size 16k;
    satisfy any;
    auth_request /_aria2_session_check;
    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    # The public origin is checked above. The local library expects its own origin.
    proxy_set_header Origin https://$host;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_hide_header Cache-Control;
    rewrite ^/_aria2/library/(.+)$ /library/$1 break;
    proxy_pass http://127.0.0.1:18081;
}

location = /_aria2/session {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers Authorization always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($http_authorization = "") { return 401; }

    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/session;
}

location = /_aria2/signout {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers Authorization always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != DELETE) { return 405; }
    if ($http_authorization = "") { return 401; }

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/session;
}

location = /_aria2_session_check {
    internal;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/session/check;
}

location = /_aria2/ticket {
    add_header Access-Control-Allow-Origin https://amirmomeni177.github.io always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    if ($http_origin != "https://amirmomeni177.github.io") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($http_authorization = "") { return 401; }

    client_max_body_size 16k;
    satisfy any;
    auth_request /_aria2_session_check;
    auth_basic "aria2 Download Server";
    auth_basic_user_file /etc/nginx/.htpasswd-aria2-download-server;
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/ticket;
}

location = /_aria2/file {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_method GET;
    proxy_pass http://unix:/run/aria2-pages/rpc.sock:/file;
}

location ^~ /_aria2_protected_file/ {
    internal;
    access_log off;
    alias /srv/aria2-downloads/;
    disable_symlinks on from=/srv/aria2-downloads;
    types {}
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;
}
